#
# Manually packages or publishes mxc-sdk and only its first-party dependency
# closure to the private Mxc-Azure-Feed Cargo registry.

trigger: none
pr: none

name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
- name: publish
  displayName: Publish packages to Mxc-Azure-Feed
  type: boolean
  default: false

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows

    customBuildTags:
    - ES365AIMigrationTooling

    stages:
    - stage: Rust_Crates
      displayName: Package or Publish Rust Crates
      jobs:
      - template: templates/Publish.Rust.Crates.Job.yml@self
        parameters:
          publish: ${{ parameters.publish }}
